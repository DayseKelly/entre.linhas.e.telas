{% extends "base.html" %}

{% block title %}{{ escola.nome }} | Entre Linhas e Telas{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
	<div>
		<span class="badge text-bg-light">Detalhes da escola</span>
		<h1 class="h2 mt-2 mb-0">{{ escola.nome }}</h1>
	</div>
	<a class="btn btn-outline-secondary" href="{% url 'listar_escolas' %}">Voltar à lista</a>
</div>

<section class="card shadow-sm" aria-label="Informações da escola">
	<div class="card-body p-4">
		<dl class="row mb-0">
			<dt class="col-sm-3">Cidade</dt>
			<dd class="col-sm-9">{{ escola.cidade }}</dd>
			<dt class="col-sm-3">Estado</dt>
			<dd class="col-sm-9">{{ escola.estado }}</dd>
		</dl>
		<div class="d-flex flex-wrap gap-2 mt-4">
			<a class="btn btn-primary" href="{% url 'editar_escola' escola.id %}">Editar escola</a>
			<a class="btn btn-outline-danger" href="{% url 'excluir_escola' escola.id %}">Excluir escola</a>
		</div>
	</div>
</section>
{% endblock %}

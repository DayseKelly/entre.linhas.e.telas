{% extends "base.html" %}

{% block title %}Excluir usuário | Entre Linhas e Telas{% endblock %}

{% block content %}
<header class="page-heading"><div><span class="page-eyebrow">Confirmação</span><h1>Excluir usuário</h1></div></header>
<section class="surface-panel p-4 p-md-5">
   
     <div class="d-flex gap-3 align-items-start">
        <i class="bi bi-exclamation-triangle text-danger fs-3" aria-hidden="true"></i>
        <div><h2 class="h5">Esta ação não pode ser desfeita.</h2><p class="text-secondary">Confirma a exclusão da conta <strong>{{ usuario.username }}</strong>?</p></div>
    </div>
    <form method="post" class="d-flex flex-wrap gap-2 mt-4">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Excluir usuário</button>
        <a class="btn btn-outline-secondary" href="{% url 'detalhe_usuario' usuario.id %}">Manter usuário</a>
    </form>
</section>
{% endblock %}
